<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/gif" href="peixe.gif">
<link rel="apple-touch-icon" href="peixe.gif">
<title>Aquário</title>
<style>
  :root {
    --fundo: #021320;
    --espuma: #eafcff;
    --agua: #7fe7ff;
    --coral: #ffa07a;
    --mono: Consolas, Menlo, "DejaVu Sans Mono", "Liberation Mono", "Courier New", monospace;
  }
  html, body { margin: 0; height: 100%; background: var(--fundo); overflow: hidden; }
  body { font-family: var(--mono); color: var(--espuma); }

  /* Camadas: recife (0) → mar da surpresa (1) → textos e botão (2) */
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  /* A grade é calculada para a proporção da tela; "contain" garante que nada seja cortado. */
  #view { object-fit: contain; background: var(--fundo); z-index: 0; transition: opacity 1.6s ease; }
  #arte { z-index: 1; opacity: 0; visibility: hidden; background: var(--fundo);
    transition: opacity 1.8s ease .3s, visibility 0s 2.1s; }

  /* Palco centralizado na água aberta, acima do recife; a posição (--ax, --ay) é calculada no script. */
  #palco { position: fixed; z-index: 2; left: var(--ax, 50%); top: var(--ay, 40%);
    transform: translate(-50%, -50%); width: min(92vw, max(19rem, calc(var(--bw, 60vw) * 1.05)));
    display: grid; place-items: center; text-align: center; pointer-events: none; }
  #palco > * { grid-area: 1 / 1; }

  #mensagem { position: relative; margin: 0; padding: .7em .9em; opacity: 0;
    font: 600 clamp(1.05rem, 2.2vw + .55rem, 1.8rem) / 1.45 var(--mono);
    letter-spacing: .01em; text-wrap: balance; overflow-wrap: normal; word-break: normal; hyphens: none;
    color: var(--espuma);
    text-shadow: 0 0 2px var(--fundo), 0 1px 3px var(--fundo), 0 0 16px rgba(2,19,32,.95), 0 0 34px rgba(2,19,32,.85); }
  /* Leve área escurecida apenas atrás das letras, para leitura sobre a água. */
  #mensagem::before { content: ""; position: absolute; inset: -.6em -1.2em; z-index: -1; border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(2,19,32,.62) 0%, rgba(2,19,32,.35) 45%, rgba(2,19,32,0) 72%); }
  #mensagem .resto { color: transparent; text-shadow: none; }
  #mensagem .cursor { display: inline-block; width: 0; position: relative; }
  #mensagem .cursor::after { content: "_"; position: absolute; left: .05em; bottom: -.05em; color: var(--agua);
    animation: piscar 1s steps(1) infinite; }
  #mensagem.completo .cursor { display: none; }
  @keyframes piscar { 50% { opacity: 0; } }

  #convite { pointer-events: auto; visibility: hidden; opacity: 0; cursor: pointer; white-space: nowrap; max-width: 94vw;
    font: 600 clamp(1rem, 1.6vw + .6rem, 1.4rem) / 1.2 var(--mono); letter-spacing: .04em;
    color: #d9fbff; background: rgba(2,19,32,.8);
    border: 1px solid rgba(127,231,255,.45); border-radius: 3px; padding: .85em 1.3em;
    box-shadow: 0 0 18px rgba(127,231,255,.16), inset 0 0 14px rgba(20,120,170,.3);
    text-shadow: 0 0 8px rgba(127,231,255,.4);
    transition: color .25s, border-color .25s, box-shadow .25s, background .25s;
    animation: brilho 3.6s ease-in-out infinite; }
  #convite::before { content: "><> "; color: var(--coral); }
  #convite::after  { content: " <><"; color: var(--coral); }
  #convite:hover, #convite:focus-visible { color: #fff; border-color: var(--agua); background: rgba(4,40,62,.88);
    box-shadow: 0 0 26px rgba(127,231,255,.34), inset 0 0 16px rgba(40,160,210,.38); }
  #convite:focus-visible { outline: 2px solid #aef3ff; outline-offset: 5px; }
  @keyframes brilho { 50% { box-shadow: 0 0 26px rgba(127,231,255,.28), inset 0 0 14px rgba(20,120,170,.36); } }
  body[data-estado="convite"] #convite { visibility: visible; }

  /* Surpresa final: frase e, logo abaixo, o botão da câmera */
  #final-bloco { position: fixed; z-index: 3; left: 50%; top: 50%; width: min(92vw, 48rem);
    transform: translate(-50%, calc(-50% + 14px)); display: flex; flex-direction: column; align-items: center;
    gap: clamp(1.2rem, 3.5vh, 2.2rem); opacity: 0; visibility: hidden; pointer-events: none; }
  #final { position: relative; margin: 0; outline: none; width: min(100%, 23ch);
    font: 700 clamp(1.35rem, 3.6vw + .5rem, 3.3rem) / 1.32 var(--mono); text-align: center; letter-spacing: .01em;
    text-wrap: balance; overflow-wrap: normal; word-break: normal; hyphens: none;
    color: #f4feff;
    /* Contorno escuro nítido + halo azul-água: a frase se destaca de qualquer ponto do mar */
    text-shadow: 0 0 1px #010a12, 1px 1px 0 #010a12, -1px -1px 0 #010a12, 1px -1px 0 #010a12, -1px 1px 0 #010a12,
      0 3px 6px rgba(1,10,18,.95), 0 0 22px rgba(1,10,18,.95), 0 0 26px rgba(127,231,255,.4), 0 0 60px rgba(80,200,255,.22); }
  #final::before { content: ""; position: absolute; inset: -1em -1.8em; z-index: -1; border-radius: 50%;
    -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
    background: radial-gradient(ellipse at center, rgba(1,10,20,.86) 0%, rgba(1,10,20,.66) 45%, rgba(1,10,20,.25) 66%, rgba(1,10,20,0) 76%); }

  /* Botão da câmera: mesma linguagem do convite, com quebra de linha equilibrada em telas estreitas */
  #camera { pointer-events: auto; cursor: pointer; max-width: min(100%, 64ch); text-wrap: balance;
    font: 700 clamp(1rem, 1.2vw + .65rem, 1.35rem) / 1.4 var(--mono); letter-spacing: .02em;
    color: #e6fdff; background: rgba(3,36,58,.93);
    border: 1.5px solid rgba(127,231,255,.85); border-radius: 4px; padding: .85em 1.3em;
    box-shadow: 0 0 0 1px rgba(1,10,18,.8), 0 0 24px rgba(127,231,255,.38), inset 0 0 16px rgba(40,160,210,.35);
    text-shadow: 0 0 10px rgba(127,231,255,.55), 0 1px 2px #010a12; opacity: 0; visibility: hidden;
    transition: color .25s, border-color .25s, box-shadow .25s, background .25s; }
  #camera::before { content: "><> "; color: var(--coral); }
  #camera::after  { content: " <><"; color: var(--coral); }
  #camera:hover, #camera:focus-visible { color: #fff; border-color: #aef3ff; background: rgba(6,56,86,.96);
    box-shadow: 0 0 0 1px rgba(1,10,18,.8), 0 0 34px rgba(127,231,255,.55), inset 0 0 18px rgba(60,190,240,.4); }
  #camera:focus-visible { outline: 2px solid #aef3ff; outline-offset: 5px; }

  body[data-estado="surpresa"] #view { opacity: 0; }
  body[data-estado="surpresa"] #arte { opacity: 1; visibility: visible; transition: opacity 1.8s ease .3s, visibility 0s; }
  body[data-estado="surpresa"] #convite { opacity: 0 !important; visibility: hidden; animation: none;
    transition: opacity .5s, visibility 0s .5s; }
  body[data-estado="surpresa"] #mensagem { display: none; }
  body[data-estado="surpresa"] #final-bloco { opacity: 1; visibility: visible; transform: translate(-50%, -50%);
    transition: opacity 1.6s ease 1.3s, transform 1.8s ease 1.3s; }
  @keyframes brilhoCamera { 50% { box-shadow: 0 0 0 1px rgba(1,10,18,.8), 0 0 36px rgba(127,231,255,.6), inset 0 0 18px rgba(60,190,240,.4); } }
  body[data-estado="surpresa"] #camera { opacity: 1; visibility: visible; animation: brilhoCamera 3.2s ease-in-out 4s infinite;
    transition: opacity 1.2s ease 3s, visibility 0s 3s, color .25s, border-color .25s, box-shadow .25s, background .25s; }

  /* Selfie: a câmera frontal ocupa a tela inteira, espelhada como um espelho */
  #selfie { position: fixed; inset: 0; z-index: 5; background: var(--fundo); opacity: 0;
    transition: opacity .8s ease; display: grid; place-items: center; }
  #selfie[hidden] { display: none; }
  #selfie.visivel { opacity: 1; }
  /* O vídeo fica invisível; a imagem (com contorno e efeitos) é desenhada no canvas */
  #selfie video { position: absolute; left: 0; top: 0; width: 2px; height: 2px; opacity: 0; pointer-events: none; }
  #selfie-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #cardume-selfie { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  #cardume-selfie[hidden] { display: none; }
  #cardume-selfie img { position: absolute; left: 0; top: 0; will-change: transform;
    filter: drop-shadow(0 0 6px rgba(127,231,255,.6)); }
  #selfie::after { content: ""; position: absolute; inset: 0; pointer-events: none;   /* Moldura suave azul-mar */
    background: radial-gradient(ellipse at center, rgba(2,19,32,0) 55%, rgba(2,19,32,.55) 100%);
    box-shadow: inset 0 0 0 1px rgba(127,231,255,.35), inset 0 0 60px rgba(80,200,255,.12); }
  #selfie-msg { position: relative; z-index: 1; max-width: min(88vw, 34ch); margin: 0; text-align: center;
    font: 600 clamp(1rem, 1.4vw + .6rem, 1.4rem) / 1.45 var(--mono); color: var(--espuma); }
  #selfie-msg:empty { display: none; }
  #selfie-fechar { position: absolute; z-index: 3; left: 50%; bottom: max(1.2rem, env(safe-area-inset-bottom));
    transform: translateX(-50%); cursor: pointer; white-space: nowrap;
    font: 600 clamp(.85rem, .8vw + .55rem, 1rem) / 1.2 var(--mono); color: #d9fbff;
    background: rgba(2,19,32,.72); border: 1px solid rgba(127,231,255,.4); border-radius: 3px; padding: .7em 1.1em; }
  #selfie-fechar:hover, #selfie-fechar:focus-visible { border-color: var(--agua); color: #fff; }
  #selfie-fechar:focus-visible { outline: 2px solid #aef3ff; outline-offset: 4px; }

  /* Controle discreto do som (necessário quando o navegador bloqueia a reprodução automática) */
  #som { position: fixed; z-index: 6; right: max(.6rem, env(safe-area-inset-right)); top: max(.6rem, env(safe-area-inset-top));
    cursor: pointer; font: 600 .78rem / 1 var(--mono); letter-spacing: .03em; color: rgba(234,252,255,.78);
    background: rgba(2,19,32,.55); border: 1px solid rgba(127,231,255,.28); border-radius: 3px; padding: .55em .8em; }
  #som:hover, #som:focus-visible { color: #fff; border-color: rgba(127,231,255,.65); }
  #som:focus-visible { outline: 2px solid #aef3ff; outline-offset: 3px; }
  #som.bloqueado { color: #d9fbff; border-color: rgba(127,231,255,.6); animation: brilho 2.4s ease-in-out infinite; }

  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  @media (prefers-reduced-motion: reduce) {
    #convite, #mensagem .cursor::after, #som.bloqueado { animation: none; }
    #view, #arte { transition-duration: .6s; transition-delay: 0s; }
    body[data-estado="surpresa"] #arte { transition: opacity .6s, visibility 0s; }
    #final-bloco { transform: translate(-50%, -50%); }
    body[data-estado="surpresa"] #final-bloco { transition: opacity .6s ease .3s; }
    body[data-estado="surpresa"] #camera { animation: none; transition: opacity .6s ease 1s, visibility 0s 1s; }
  }
</style>
</head>
<body>
<canvas id="view" role="img" aria-label="Recife de corais animado, desenhado com caracteres ASCII: algas balançando, corais, anêmonas, peixes nadando e bolhas subindo no fundo do mar"></canvas>
<canvas id="arte" role="img" aria-label="O mar sob um céu azul, recriado com caracteres ASCII coloridos, com ondas e reflexos de sol"></canvas>

<main id="palco">
  <p id="mensagem" aria-hidden="true"><span class="digitado"></span><span class="cursor"></span><span class="resto"></span></p>
  <button id="convite" type="button" aria-label="Um último mergulho...">Um último mergulho...</button>
</main>
<p id="leitor" class="sr-only" aria-live="polite"></p>
<div id="final-bloco">
  <p id="final" tabindex="-1">Não sei desenhar o oceano, mas sei programar um pra você.</p>
  <button id="camera" type="button">Clique aqui pra ver o tesouro mais bonito do oceano!</button>
</div>
<div id="selfie" hidden role="dialog" aria-modal="true" aria-label="Câmera frontal">
  <video id="selfie-video" autoplay playsinline muted></video>
  <canvas id="selfie-canvas" aria-hidden="true"></canvas>
  <div id="cardume-selfie" aria-hidden="true" hidden></div>
  <p id="selfie-msg" role="status"></p>
  <button id="selfie-fechar" type="button">[ fechar câmera ]</button>
</div>
<audio id="musica" src="oceano.mp3" loop autoplay preload="auto"></audio>
<button id="som" type="button" aria-pressed="true">[ som: ligado ]</button>

<script>
"use strict";
// CONFIGURAÇÕES
const FONT_SIZE = 10, FPS = 30;
const FONT = `${FONT_SIZE}px Menlo, Consolas, "DejaVu Sans Mono", "Courier New", monospace`;
const probe = document.createElement("canvas").getContext("2d");
probe.font = FONT;
const CW = Math.max(1, Math.round(probe.measureText("M").width)), CH = Math.round(FONT_SIZE * 1.15);
const WAVE_PERIOD = 14;
const settings = { corrente: 1, glow: 0.6 };   // intensidade da correnteza e do brilho difuso

// Movimento reduzido: correnteza suave, água mais lenta, sem cardumes nem digitação.
const reduceQuery = matchMedia("(prefers-reduced-motion: reduce)");
let REDUCED = reduceQuery.matches;
function aplicarMovimento() { REDUCED = reduceQuery.matches; settings.corrente = REDUCED ? 0.3 : 1; }
aplicarMovimento();
reduceQuery.addEventListener("change", aplicarMovimento);

const BUCKETS = [" ", ".'`", ":;,-~", "!/\\|()[]{}<>?+=", "tfjrxnuvczil", "XYUJCLQ0OZmwqpdbkhao", "#MW&8%B", "@$"];
const LEVELS = [0.06, 0.15, 0.30, 0.45, 0.60, 0.75, 0.90];
const CHARS = BUCKETS.join("") + "*3";            // "3" forma os coraçõezinhos <3 das bolhas do buquê
const CH_IDX = (ch) => CHARS.indexOf(ch);

// FUNÇÕES MATEMÁTICAS
const TAU = Math.PI * 2, rad = (d) => d * Math.PI / 180;
const clamp = (x, lo = 0, hi = 1) => (x < lo ? lo : x > hi ? hi : x);
function smoothstep(a, b, x) { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); }
const wave = (t, k, ph = 0) => Math.sin(TAU * k * t / WAVE_PERIOD + ph);
function hash3(a, b, c) {                       // Pseudoaleatoriedade determinística: entradas iguais produzem resultados iguais
  let h = (Math.imul(a, 73856093) ^ Math.imul(b, 19349663) ^ Math.imul(c, 83492791)) >>> 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177) >>> 0;
  return (h ^ (h >>> 16)) >>> 0;
}
const rnd = (k) => hash3(k, 911, 37) / 4294967296;      // Número pseudoaleatório fixo no intervalo de 0 a 1
const mul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
const lin = (n) => Array.from({ length: n }, (_, k) => k / (n - 1));
const lerp3 = (a, b, k) => { k = clamp(k); return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k]; };
const easeOut = (x) => 1 - Math.pow(1 - clamp(x), 3);
function rampa(stops, k) {
  k = clamp(k);
  for (let s = 1; s < stops.length; s++)
    if (k <= stops[s][0]) return lerp3(stops[s - 1][1], stops[s][1], (k - stops[s - 1][0]) / (stops[s][0] - stops[s - 1][0]));
  return stops[stops.length - 1][1];
}

// ENQUADRAMENTO RESPONSIVO
// Caixa, em unidades do mundo, que contém o recife inteiro (algas, corais, anêmonas e o balanço da correnteza).
// A grade ASCII é dimensionada para que essa caixa sempre caiba na tela, em qualquer proporção.
const BOX = { x0: -72, x1: 72, y0: -7, y1: 184 };
const BOX_W = BOX.x1 - BOX.x0, BOX_H = BOX.y1 - BOX.y0;
const X_MID = (BOX.x0 + BOX.x1) / 2;
const BASE_Y = 178;                                     // Fundo do mar: fica sempre rente à borda inferior da tela
function gridFor(w, h) {
  w = Math.max(1, w); h = Math.max(1, h);
  const A = w / h, R = CH / CW;                 // Proporção da tela e da célula
  // Com 1 unidade por linha (e 0,5 por coluna), a caixa exige BOX_H linhas e 2·BOX_W colunas.
  let rows = BOX_H, cols = rows * R * A;
  if (cols < 2 * BOX_W) { cols = 2 * BOX_W; rows = cols / (R * A); }   // Tela estreita: a largura limita
  // Limita o número de células conforme a área da tela, para manter a fluidez em celulares.
  const budget = clamp(w * h / 14, 26000, 95000);
  const s = Math.max(1, Math.sqrt(rows * cols / budget));
  return { cols: Math.max(40, Math.round(cols / s)), rows: Math.max(40, Math.round(rows / s)) };
}
// Estado que depende do tamanho da tela; recriado por setupGrid() apenas quando a proporção muda bastante.
let GRID_ASPECT, COLS, ROWS, N, S, Y0, VIS, VIS_W, VIS_H, VMIN, HW_MIN;
let Xc, Yr, lum, rgb, rowShift, fg, ovr, topoAreia;

// TELA: LUMINOSIDADE E COR DE CADA CÉLULA
// fg = 1: célula ocupada pelo recife, peixes ou bolhas. ovr: caractere fixo (bolhas, cardumes, superfície).
function set(i, l, cr, cg, cb) { lum[i] = l; fg[i] = 1; ovr[i] = -1; const j = i * 3; rgb[j] = cr; rgb[j + 1] = cg; rgb[j + 2] = cb; }
function setCh(i, l, cr, cg, cb, ch) { set(i, l, cr, cg, cb); ovr[i] = ch; }
const celula = (x, y) => {                              // Índice da célula de um ponto do mundo (ou -1, fora da tela)
  const r = Math.floor((y - Y0) / S), c = Math.floor((x - X_MID) * 2 / S + COLS / 2);
  return r < 0 || r >= ROWS || c < 0 || c >= COLS ? -1 : r * COLS + c;
};

// ÁGUA: degradê do azul-turquesa iluminado perto da superfície ao azul-marinho profundo,
// com cáusticas (a rede de luz que dança no mar) e raios de sol entrando pela superfície.
const AGUA = [
  [0.00, [0.10, 0.42, 0.60]], [0.22, [0.05, 0.26, 0.44]], [0.50, [0.02, 0.13, 0.27]],
  [0.80, [0.01, 0.07, 0.16]], [1.00, [0.02, 0.09, 0.15]],
];
let agS1, agC1, agS2, agC2, agTopo, agRaioK, agRaioW, agBase, agChar, agRuido;
const N_RAIOS = 5;
const CH_ONDA = CH_IDX("~"), CH_TRACO = CH_IDX("-"), CH_PONTO = CH_IDX("."), CH_RAIO = CH_IDX("\\");
function buildAgua() {
  agS1 = new Float32Array(N); agC1 = new Float32Array(N); agS2 = new Float32Array(N); agC2 = new Float32Array(N);
  agTopo = new Float32Array(N); agRaioK = new Int8Array(N); agRaioW = new Float32Array(N);
  agBase = new Float32Array(N * 3); agChar = new Int16Array(N); agRuido = new Float32Array(N);
  const raios = Array.from({ length: N_RAIOS }, (_, k) => ({
    x: VIS.x0 + VIS_W * (0.1 + 0.2 * k + (rnd(300 + k) - 0.5) * 0.08), w: 3 + rnd(310 + k) * 5,
  }));
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const i = r * COLS + c, x = Xc[c], y = Yr[r], f = (y - VIS.y0) / VIS_H, n = hash3(r, c, 5) / 4294967296;
    // Duas ondas bem distorcidas: onde elas se cruzam surge a rede irregular de luz das cáusticas.
    const p1 = x * 0.34 + 2.6 * Math.sin(y * 0.19 + x * 0.07) + 1.3 * Math.sin(y * 0.41 - x * 0.13);
    const p2 = y * 0.31 + 2.4 * Math.sin(x * 0.16 - y * 0.09) + 1.2 * Math.sin(x * 0.37 + y * 0.17) + x * 0.11;
    agS1[i] = Math.sin(p1); agC1[i] = Math.cos(p1); agS2[i] = Math.sin(p2); agC2[i] = Math.cos(p2);
    agTopo[i] = 0.1 + 0.9 * Math.exp(-f * 2.6);                 // Cáusticas mais fortes perto da superfície
    let melhor = 0, k0 = 0;
    raios.forEach((ra, k) => {                                  // Raios inclinados, que se apagam com a profundidade
      const d = x - (ra.x + (y - VIS.y0) * 0.28), w = Math.exp(-((d / ra.w) ** 2)) * Math.exp(-f * 1.7);
      if (w > melhor) { melhor = w; k0 = k; }
    });
    agRaioK[i] = k0; agRaioW[i] = melhor;
    const cor = lerp3(rampa(AGUA, f), [0.02, 0.18, 0.30], (n - 0.5) * 0.4);
    agBase.set(cor, i * 3);
    agChar[i] = melhor > 0.35 && n < 0.55 ? CH_RAIO : n < 0.48 ? CH_ONDA : n < 0.8 ? CH_TRACO : CH_PONTO;
    agRuido[i] = n;
  }
}
const ampRaio = new Float32Array(N_RAIOS);
function agua(t) {
  fg.fill(0); ovr.fill(-1);
  const m = settings.corrente, a1 = t * 0.9 * m, a2 = -t * 0.7 * m;
  const ca1 = Math.cos(a1), sa1 = Math.sin(a1), ca2 = Math.cos(a2), sa2 = Math.sin(a2);
  for (let k = 0; k < N_RAIOS; k++) ampRaio[k] = 0.11 + 0.07 * Math.sin(t * 0.35 * m + k * 1.9);
  for (let i = 0, j = 0; i < N; i++, j += 3) {
    const v1 = agS1[i] * ca1 + agC1[i] * sa1, v2 = agS2[i] * ca2 + agC2[i] * sa2;   // sen(p1 + a1), sen(p2 + a2)
    let cau = 1 - Math.abs(v1 + v2) * 0.9;                                          // Linhas onde as ondas se cruzam
    cau = cau > 0 ? cau * cau * cau : 0;
    const topo = agTopo[i], raio = agRaioW[i] * ampRaio[agRaioK[i]];
    lum[i] = 0.035 + topo * 0.24 * cau + raio + 0.03 * agRuido[i];
    const k = 0.75 + 1.1 * cau * topo + 3 * raio;
    rgb[j] = agBase[j] * k + raio * 0.6; rgb[j + 1] = agBase[j + 1] * k + raio * 1.1; rgb[j + 2] = agBase[j + 2] * k + raio * 1.2;
  }
  // Superfície: uma linha de ondas no alto da tela, com a luz do céu acima dela.
  const ys = VIS.y0 + 2.6;
  for (let c = 0; c < COLS; c++) {
    const x = Xc[c], h = ys + 1.1 * Math.sin(x * 0.14 + t * 1.4 * m) + 0.5 * Math.sin(x * 0.33 - t * 1.0 * m);
    for (let r = 0; r < ROWS && Yr[r] < h + 1.5; r++) {
      const i = r * COLS + c, y = Yr[r];
      if (Math.abs(y - h) < 0.45 + 0.35 * S) setCh(i, 0.78, 0.72, 0.95, 1.0, CH_ONDA);
      else if (y < h) { lum[i] = 0.16; const j = i * 3; rgb[j] = 0.35; rgb[j + 1] = 0.66; rgb[j + 2] = 0.82; }
    }
  }
}

// CARDUMES: de vez em quando (6 a 9 s) um cardume de peixinhos ><> atravessa a água no alto.
const PEIXINHOS = Array.from({ length: 12 }, (_, k) => ({ dx: (rnd(400 + k) - 0.5) * 24, dy: (rnd(420 + k) - 0.5) * 10, ph: rnd(440 + k) * TAU }));
const cardume = { ativo: false, t0: 0, dir: 1, y: 0, vel: 0, x0: 0 };
let proximoCardume = 4 + Math.random() * 2;
const CH_MAIOR = CH_IDX(">"), CH_MENOR = CH_IDX("<");
function cardumes(t) {
  if (REDUCED || estado === "surpresa") { cardume.ativo = false; return; }
  const cd = cardume;
  if (!cd.ativo) {
    if (t < proximoCardume) return;
    cd.dir = Math.random() < 0.5 ? 1 : -1; cd.vel = 20 + Math.random() * 10;
    cd.y = VIS.y0 + VIS_H * (0.1 + 0.22 * Math.random());
    cd.x0 = cd.dir > 0 ? VIS.x0 - 16 : VIS.x1 + 16; cd.t0 = t; cd.ativo = true;
  }
  const x = cd.x0 + cd.dir * cd.vel * (t - cd.t0);
  if (cd.dir > 0 ? x - 16 > VIS.x1 : x + 16 < VIS.x0) { cd.ativo = false; proximoCardume = t + 6 + Math.random() * 3; return; }
  const forma = cd.dir > 0 ? [CH_MAIOR, CH_MENOR, CH_MAIOR] : [CH_MENOR, CH_MAIOR, CH_MENOR];   // ><> ou <><
  for (const p of PEIXINHOS) {
    const i = celula(x + p.dx, cd.y + p.dy + 1.2 * Math.sin(t * 2.2 + p.ph));
    if (i < 0) continue;
    const c = i % COLS;
    for (let k = -1; k <= 1; k++) if (c + k >= 0 && c + k < COLS) setCh(i + k, 0.62, 0.74, 0.9, 0.98, forma[k + 1]);
  }
}

// BOLHAS: sobem das anêmonas, das algas e da areia, crescendo um pouquinho e estourando na superfície.
const BOLHAS = Array.from({ length: 80 }, () => ({ vivo: false }));
const CH_BOLHA = [CH_IDX("."), CH_IDX("o"), CH_IDX("O")], CH_TRES = CH_IDX("3");
let acumBolhas = 0, ultimoT = 0;
function bolhas(t, dt) {
  acumBolhas += (REDUCED ? 2 : 7) * dt * smoothstep(1, 3, t);
  for (; acumBolhas >= 1; acumBolhas--) {
    const b = BOLHAS.find((q) => !q.vivo);
    if (!b) break;
    const fonte = Math.random();
    b.coracao = false;
    if (fonte < 0.45) {                                                     // Do buquê sobem bolhas e coraçõezinhos <3
      const f = FLORES_MAR[(Math.random() * FLORES_MAR.length) | 0];
      if (t < f.t0 + 1) continue;
      b.x = f.x + (Math.random() - 0.5) * f.R; b.y = f.y - f.R * 0.6; b.coracao = Math.random() < 0.4;
    }
    else if (fonte < 0.7) { const g = ALGAS[(Math.random() * ALGAS.length) | 0]; b.x = g.x; b.y = areia(g.x) - Math.random() * g.h * 0.6; }
    else { b.x = VIS.x0 + Math.random() * VIS_W; b.y = 164; }
    b.x0 = b.x; b.vy = -(6 + Math.random() * 8) * (REDUCED ? 0.4 : 1); b.ph = Math.random() * TAU;
    b.tam = Math.random() * 0.5; b.vivo = true;
  }
  for (const b of BOLHAS) {
    if (!b.vivo) continue;
    b.y += b.vy * dt; b.tam = Math.min(1, b.tam + dt * 0.12);
    b.x = b.x0 + Math.sin(t * 2.2 + b.ph) * 0.9;
    if (b.y < VIS.y0 + 3.2) { b.vivo = false; continue; }                      // Estoura na superfície
    const i = celula(b.x, b.y);
    if (i < 0) continue;
    if (b.coracao) {
      setCh(i, 0.8, 1.0, 0.48, 0.68, CH_MENOR);
      if ((i % COLS) + 1 < COLS) setCh(i + 1, 0.8, 1.0, 0.48, 0.68, CH_TRES);
    } else setCh(i, 0.5 + 0.35 * b.tam, 0.78, 0.96, 1.0, CH_BOLHA[b.tam < 0.35 ? 0 : b.tam < 0.75 ? 1 : 2]);
  }
}

// Desenha uma forma afinada ao longo de uma curva; a função recebe célula, posição, lateral, linha e coluna.
const SEG = new Float64Array(16 * 9);            // Dados dos segmentos, calculados uma vez por desenho
function brush(pts, hws, av, fn) {
  const n = pts.length, ns = n - 1;
  if (n < 2) return;
  let xmin = 1e9, xmax = -1e9, ymin = 1e9, ymax = -1e9, maxw = 0;
  for (let k = 0; k < n; k++) {
    const x = pts[k][0], y = pts[k][1];
    if (x < xmin) xmin = x; if (x > xmax) xmax = x; if (y < ymin) ymin = y; if (y > ymax) ymax = y;
    if (hws[k] > maxw) maxw = hws[k];
  }
  for (let s = 0; s < ns; s++) {
    const o = s * 9, ax = pts[s][0], ay = pts[s][1], dx = pts[s + 1][0] - ax, dy = pts[s + 1][1] - ay;
    SEG[o] = ax; SEG[o + 1] = ay; SEG[o + 2] = dx; SEG[o + 3] = dy; SEG[o + 4] = 1 / (dx * dx + dy * dy + 1e-9);
    SEG[o + 5] = hws[s]; SEG[o + 6] = hws[s + 1] - hws[s]; SEG[o + 7] = av[s]; SEG[o + 8] = av[s + 1] - av[s];
  }
  const pad = Math.max(maxw, HW_MIN) + S;
  const r0 = Math.max(0, Math.floor((ymin - pad - Y0) / S)), r1 = Math.min(ROWS, Math.ceil((ymax + pad - Y0) / S) + 1);
  for (let r = r0; r < r1; r++) {
    const py = Yr[r], sh = rowShift[r];                // Deslocamento horizontal da linha causado pela correnteza
    let rx0 = 1e9, rx1 = -1e9;
    for (let s = 0, o = 0; s < ns; s++, o += 9) {
      const pw = Math.max(SEG[o + 5], SEG[o + 5] + SEG[o + 6], HW_MIN) + S;
      const ya = SEG[o + 1], yb = ya + SEG[o + 3];
      if (py < Math.min(ya, yb) - pw || py > Math.max(ya, yb) + pw) continue;
      const xa = SEG[o], xb = xa + SEG[o + 2];
      rx0 = Math.min(rx0, Math.min(xa, xb) - pw); rx1 = Math.max(rx1, Math.max(xa, xb) + pw);
    }
    if (rx0 > rx1) continue;
    const c0 = Math.max(0, Math.floor((rx0 + sh - X_MID) * 2 / S + COLS / 2));
    const c1 = Math.min(COLS, Math.ceil((rx1 + sh - X_MID) * 2 / S + COLS / 2) + 1);
    for (let c = c0; c < c1; c++) {
      const px = Xc[c] - sh;
      let best = 1, bestS = -1, bestU = 0;
      for (let s = 0, o = 0; s < ns; s++, o += 9) {
        const qx = px - SEG[o], qy = py - SEG[o + 1], dx = SEG[o + 2], dy = SEG[o + 3];
        let u = (qx * dx + qy * dy) * SEG[o + 4];
        u = u < 0 ? 0 : u > 1 ? 1 : u;
        const ex = qx - dx * u, ey = qy - dy * u;
        let hw = SEG[o + 5] + SEG[o + 6] * u;
        if (hw < HW_MIN) hw = HW_MIN;
        const q2 = (ex * ex + ey * ey) / (hw * hw);
        if (q2 < best) { best = q2; bestS = s; bestU = u; }
      }
      if (bestS < 0) continue;
      const o = bestS * 9;
      const cr = SEG[o + 2] * (py - SEG[o + 1]) - SEG[o + 3] * (px - SEG[o]);
      const side = cr > 0 ? 1 : cr < 0 ? -1 : 0;
      fn(r * COLS + c, SEG[o + 7] + SEG[o + 8] * bestU, Math.sqrt(best) * side, r, c);
    }
  }
}

// RECIFE
// Areia ondulada, rochas, algas compridas que balançam, corais ramificados que crescem e anêmonas que se abrem.
const areia = (x) => 166 + 3.5 * Math.sin(x * 0.05 + 0.6) + 2.5 * Math.cos(x * 0.12 + 1.3);
const ROCHAS = [[-32, 168, 17, 8], [24, 169, 19, 7.5], [-4, 167, 12, 6.5], [48, 171, 12, 5.5], [-54, 172, 11, 5]];
const VERDES = [
  [[0.06, 0.22, 0.10], [0.34, 0.66, 0.26]],        // Verde-alga
  [[0.20, 0.20, 0.06], [0.64, 0.62, 0.22]],        // Oliva-dourado
  [[0.04, 0.20, 0.17], [0.26, 0.64, 0.50]],        // Verde-azulado
];
// x, altura, fase do balanço, paleta, largura, plano (de fundo = mais escura), início do crescimento
// As algas ficam nas laterais, emoldurando o buquê no centro.
const ALGAS = [
  { x: -63, h: 112, fase: 0.0, cor: 0, larg: 2.6, fundo: false, t0: 0.10 },
  { x: -54, h: 146, fase: 1.2, cor: 1, larg: 2.9, fundo: false, t0: 0.25 },
  { x: 54, h: 150, fase: 1.9, cor: 0, larg: 3.0, fundo: false, t0: 0.15 },
  { x: 63, h: 104, fase: 2.8, cor: 2, larg: 2.4, fundo: false, t0: 0.45 },
  { x: -32, h: 132, fase: 3.3, cor: 2, larg: 2.2, fundo: true, t0: 0.55 },
  { x: 31, h: 138, fase: 4.1, cor: 1, larg: 2.3, fundo: true, t0: 0.35 },
];
function alga(g, t) {
  const cresce = easeOut((t - g.t0) / 1.8);
  if (cresce <= 0.01) return;
  const n = 15, base = areia(g.x) + 1, H = g.h * cresce, m = settings.corrente;
  const pts = [], hws = [];
  for (let k = 0; k < n; k++) {
    const u = k / (n - 1);
    // Onda que sobe pela alga (a ponta balança mais que a base), com uma ondulação própria, como uma fita.
    const balanco = (6 * Math.pow(u, 1.3) * Math.sin(t * 0.9 * m + g.fase - u * 2.4) + 1.6 * Math.sin(u * 9 + g.fase) * u) * m;
    pts.push([g.x + balanco, base - u * H]);
    hws.push(g.larg * (0.55 + 0.45 * Math.sin(Math.PI * Math.min(0.97, 0.15 + u * 0.85))) * (0.78 + 0.22 * Math.sin(k * 1.3 + t * 1.5 * m)));
  }
  const [esc, cla] = VERDES[g.cor], plano = g.fundo ? 0.55 : 1;
  const pinta = (i, a, q, extra = 0) => {
    const aq = Math.abs(q);
    let l = (0.4 + 0.32 * (1 - aq) - 0.12 * q + extra) * plano;
    if (aq < 0.12) l += 0.08;                                                  // Nervura central
    const c = lerp3(esc, cla, 0.35 + 0.4 * (1 - aq) + 0.25 * a);
    set(i, clamp(l), c[0] * plano, c[1] * plano, c[2] * plano);
  };
  brush(pts, hws, lin(n), pinta);
  // Folhas compridas alternadas ao longo da haste, ondulando com a correnteza.
  for (let k = 2; k < n - 1; k++) {
    const [x, y] = pts[k], lado = k % 2 ? 1 : -1, u = k / (n - 1);
    const ang = rad(-90 + lado * (42 + 14 * Math.sin(t * 1.2 * m + k + g.fase))), len = (8 + 5 * (1 - u)) * cresce;
    const ca = Math.cos(ang), sa = Math.sin(ang);
    brush([[x, y], [x + ca * len * 0.5, y + sa * len * 0.5 - 0.8], [x + ca * len, y + sa * len - 2.2]],
      [g.larg * 0.35, g.larg * 0.6, 0.1], [0.6, 0.8, 1], (i, a, q) => pinta(i, a, q, 0.05));
  }
}

// Corais ramificados: cada galho se divide em dois ou três, e os galhos crescem em sequência.
const CORAIS = [
  { x: -46, ang: -84, len: 30, cor: [1.00, 0.40, 0.46], claro: [1.00, 0.80, 0.82], t0: 0.5 },
  { x: 46, ang: -96, len: 30, cor: [0.64, 0.34, 0.92], claro: [0.92, 0.78, 1.00], t0: 0.8 },
  { x: -64, ang: -80, len: 20, cor: [1.00, 0.60, 0.22], claro: [1.00, 0.92, 0.62], t0: 1.1 },
  { x: 64, ang: -100, len: 20, cor: [1.00, 0.78, 0.25], claro: [1.00, 0.95, 0.70], t0: 1.0 },
];
function galho(lista, x, y, ang, len, w, prof, sem, t0) {
  const x1 = x + Math.cos(ang) * len, y1 = y + Math.sin(ang) * len;
  lista.push({ x0: x, y0: y, x1, y1, w0: w, w1: w * 0.74, prof, t0 });
  if (prof >= 4) return;
  const n = rnd(sem) < 0.3 ? 3 : 2;
  for (let j = 0; j < n; j++) {
    const a = ang + (j - (n - 1) / 2) * rad(26 + rnd(sem + j) * 16) + (rnd(sem + j + 7) - 0.5) * rad(10);
    galho(lista, x1, y1, a, len * (0.66 + rnd(sem + j + 3) * 0.12), w * 0.74, prof + 1, sem * 3 + j + 1, t0 + 0.3);
  }
}
for (const [k, co] of CORAIS.entries()) {
  co.galhos = [];
  galho(co.galhos, co.x, areia(co.x) - 1, rad(co.ang), co.len * 0.5, 2.8, 0, 50 + k * 97, co.t0);
}
function coral(co, t) {
  for (const s of co.galhos) {
    const g = clamp((t - s.t0) / 0.35);
    if (g <= 0) continue;
    const xe = s.x0 + (s.x1 - s.x0) * g, ye = s.y0 + (s.y1 - s.y0) * g;
    const base = lerp3(mul(co.cor, 0.55), co.cor, s.prof / 4);
    brush([[s.x0, s.y0], [xe, ye]], [s.w0, s.w0 + (s.w1 - s.w0) * g], [0, 1], (i, a, q) => {
      const aq = Math.abs(q), c = lerp3(base, co.claro, (1 - aq) * 0.35 * (s.prof / 4));
      set(i, clamp(0.42 + 0.3 * (1 - aq) - 0.1 * q), c[0], c[1], c[2]);
    });
    if (s.prof === 4 && g >= 1) {                                               // Pólipos acesos nas pontas
      const p = 0.75 + 0.25 * Math.sin(t * 2.4 + s.x1);
      brush([[xe, ye], [xe, ye - 0.01]], [1.2, 1.2], [0, 1], (i) => set(i, 0.88 * p, co.claro[0], co.claro[1], co.claro[2]));
    }
  }
}

// BUQUÊ DO MAR: flores de anêmona no alto de hastes verdes, amarradas com um laço rosa —
// um buquê de fundo do mar para mandar pra alguém especial. As hastes crescem, depois as flores se abrem.
const LACO_Y = 150, BASE_BUQUE = 165;
// x, y (centro da flor), raio, nº de tentáculos, cor, ponta, miolo, quando começa a abrir
const FLORES_MAR = [
  { x: 0, y: 86, R: 12, n: 18, cor: [1.00, 0.30, 0.52], ponta: [1.00, 0.72, 0.84], miolo: [1.00, 0.86, 0.30], t0: 2.5 },
  { x: -21, y: 103, R: 11, n: 16, cor: [0.92, 0.24, 0.72], ponta: [1.00, 0.70, 0.92], miolo: [1.00, 0.90, 0.42], t0: 2.1 },
  { x: 21, y: 101, R: 11, n: 16, cor: [0.14, 0.78, 0.76], ponta: [0.70, 0.95, 0.95], miolo: [1.00, 0.72, 0.30], t0: 2.3 },
  { x: -37, y: 124, R: 9, n: 14, cor: [1.00, 0.52, 0.10], ponta: [1.00, 0.84, 0.50], miolo: [1.00, 0.36, 0.30], t0: 1.8 },
  { x: 37, y: 122, R: 9, n: 14, cor: [0.60, 0.36, 0.98], ponta: [0.86, 0.74, 1.00], miolo: [1.00, 0.86, 0.36], t0: 2.0 },
  { x: -12, y: 125, R: 9, n: 14, cor: [1.00, 0.78, 0.14], ponta: [1.00, 0.92, 0.60], miolo: [1.00, 0.46, 0.30], t0: 2.7 },
  { x: 13, y: 127, R: 8.5, n: 14, cor: [1.00, 0.40, 0.38], ponta: [1.00, 0.76, 0.72], miolo: [1.00, 0.90, 0.40], t0: 2.9 },
].map((f, k) => ({ ...f, k, x: f.x * 1.15, y: LACO_Y - (LACO_Y - f.y) * 1.12, R: f.R * 1.15,   // Buquê 15% maior
  inicio: 0.6 + k * 0.08, curva: (f.x >= 0 ? 1 : -1) * (k % 2 ? 3 : -2) }))
 .sort((a, b) => a.y - b.y);                                                // As de cima ficam atrás
const HASTE = [[0.07, 0.24, 0.13], [0.30, 0.66, 0.36]];
function curvaHaste(f, cresce) {                                            // Da base, passando pelo laço, até a flor
  const p0 = [f.x * 0.16, BASE_BUQUE], p1 = [f.x, f.y + f.R * 0.25], out = [];
  for (let k = 0; k < 12; k++) {
    const s = (k / 11) * cresce, b = f.curva * Math.sin(Math.PI * s);
    const pinca = 1 - 0.8 * Math.exp(-(((p0[1] + (p1[1] - p0[1]) * s - LACO_Y) / 6) ** 2));   // Aperta no laço
    out.push([(p0[0] + (p1[0] - p0[0]) * s + b) * pinca, p0[1] + (p1[1] - p0[1]) * s]);
  }
  return out;
}
function haste(f, t) {
  const cresce = easeOut((t - f.inicio) / 1.2);
  if (cresce <= 0.01) return;
  brush(curvaHaste(f, cresce), lin(12).map((u) => 0.95 - 0.35 * u), lin(12), (i, a, q) => {
    const c = lerp3(HASTE[0], HASTE[1], 0.5 - 0.5 * q);
    set(i, clamp(0.42 + 0.33 * (1 - Math.abs(q)) - 0.15 * q), c[0], c[1], c[2]);
  });
}
function florMar(f, t) {
  if (t < f.inicio + 1.2) return;                                           // Abre só depois que a haste cresceu
  const abre = smoothstep(f.t0, f.t0 + 1.4, t), m = settings.corrente;
  const respira = REDUCED ? 0 : 0.07 * Math.sin(t * 0.9 + f.k * 1.3);
  if (abre < 0.05) {                                                        // Botão fechado
    brush([[f.x, f.y], [f.x, f.y - 0.01]], [2.2, 2.2], [0, 1], (i, a, q) =>
      set(i, 0.5 + 0.25 * (1 - Math.abs(q)), f.cor[0] * 0.8, f.cor[1] * 0.8, f.cor[2] * 0.8));
    return;
  }
  const giro = f.k * 0.7;
  for (let k = 0; k < f.n; k++) {                                           // Tentáculos em volta, como pétalas
    const a0 = giro + (k / f.n) * TAU;
    const len = f.R * (0.82 + 0.18 * rnd(k * 13 + f.k * 7)) * (0.3 + 0.7 * abre) * (1 - respira);
    const pts = [], hws = [];
    let x = f.x + Math.cos(a0) * f.R * 0.2, y = f.y + Math.sin(a0) * f.R * 0.2;
    for (let s = 0; s < 6; s++) {
      const u = s / 5;
      pts.push([x, y]); hws.push(1.3 - 0.8 * u);
      const ang = a0 + rad(24) * m * u * Math.sin(t * 1.3 * m + k * 0.7 - u * 2);
      x += Math.cos(ang) * len * 0.8 / 5; y += Math.sin(ang) * len * 0.8 / 5;
    }
    brush(pts, hws, lin(6), (i, a, q) => {
      const c = lerp3(mul(f.cor, 0.8), f.ponta, Math.pow(a, 3) * 0.8);   // Cor viva até perto da ponta
      set(i, clamp(0.44 + 0.26 * (1 - Math.abs(q)) + 0.08 * a), c[0], c[1], c[2]);
    });
    const p = 0.75 + 0.25 * Math.sin(t * 2 + k);
    brush([[x, y], [x, y - 0.01]], [0.9, 0.9], [0, 1], (i) => set(i, 0.8 * p, f.ponta[0], f.ponta[1], f.ponta[2]));
  }
  const rm = f.R * 0.3 * Math.sqrt(abre);                                   // Miolo
  brush([[f.x, f.y], [f.x, f.y - 0.01]], [rm, rm], [0, 1], (i, a, q) => {
    const aq = Math.abs(q), c = lerp3(f.miolo, mul(f.cor, 0.6), aq * aq);
    set(i, clamp(0.78 - 0.3 * aq), c[0], c[1], c[2]);
  });
}
// Laço rosa que amarra as hastes.
const LACO_E = [0.80, 0.18, 0.42], LACO_C = [1.00, 0.70, 0.84];
function laco(cresce) {
  if (cresce <= 0.01) return;
  const g = cresce, pinta = (pts, w) => brush(pts, pts.map(() => w * g), lin(pts.length), (i, a, q) => {
    const k = clamp(0.55 - 0.45 * q);
    set(i, 0.52 + 0.3 * (1 - Math.abs(q)) - 0.12 * q, ...lerp3(LACO_E, LACO_C, k));
  });
  const y = LACO_Y, m = (pts) => pts.map(([x, yy]) => [-x, yy]);
  const alca = [[-1, y - 0.5], [-6, y - 6 * g], [-13, y - 8 * g], [-16 * g, y - 3 * g], [-11 * g, y + 1], [-1, y]];
  const ponta = [[-1, y + 1], [-4, y + 8 * g], [-8, y + 14 * g], [-6.5, y + 16 * g]];
  pinta([[-5, y - 0.4], [5, y + 0.4]], 2.2);         // Faixa em volta das hastes
  pinta(alca, 1.4); pinta(m(alca), 1.4);

// espécie, altura no mundo, comprimento, direção, velocidade, entrada (s), plano (1 = frente)
const PEIXES = [
  ["palhaco", 112, 26, 1, 10, 2.2, 1],
  ["cirurgiao", 82, 28, -1, 12, 3.0, 1],
  ["amarelo", 100, 21, -1, 9, 3.8, 0.85],
  ["anjo", 40, 26, 1, 8, 4.5, 0.9],
  ["neon", 64, 14, 1, 15, 2.6, 0.7],
  ["neon", 70, 13, 1, 15, 2.75, 0.7],
  ["palhaco", 132, 16, -1, 7, 5.2, 0.75],
].map(([esp, y, L, dir, vel, t0, plano], k) => ({ esp: ESPECIES[esp], y, L, dir, vel, t0, plano, sem: k * 2.3 }));
const CH_OLHO = CH_IDX("o");
function peixe(p, t) {
  if (t < p.t0) return;
  const margem = p.L * 1.6 + 6, vao = VIS_W + 2 * margem;
  const inicio = p.dir > 0 ? VIS.x0 - margem : VIS.x1 + margem;
  const x = inicio + p.dir * ((p.vel * (t - p.t0)) % vao), y = p.y + 2.5 * Math.sin(t * 0.7 + p.sem);
  const e = p.esp, L = p.L, H = L * e.alto, d = p.dir, bri = p.plano, mv = REDUCED ? 0.3 : 1;
  const pts = [], hws = [], n = 8;
  for (let k = 0; k < n; k++) {
    const a = k / (n - 1);
    pts.push([x - d * a * L * 0.78, y + Math.sin(t * 7 * mv + p.sem - a * 3) * a * L * 0.03]);
    hws.push(H * Math.max(0.2, Math.pow(Math.sin(Math.PI * Math.pow(Math.min(a, 0.999), 0.7)), 0.8)));
  }
  const cor = (a, aq) => {
    for (const [f0, f1] of e.faixas) if (a >= f0 && a <= f1 && (!e.centro || aq < 0.5)) return e.faixa;
    return e.corpo;
  };
  const dim = 0.55 + 0.45 * bri;
  // Cauda em leque, abanando.
  const [bx, by] = pts[n - 1], abana = Math.sin(t * 8 * mv + p.sem) * H * 0.5;
  brush([[bx, by], [bx - d * L * 0.26, by + abana]], [H * 0.16, H * 0.82], [0, 1], (i, a, q) =>
    set(i, clamp((0.5 + 0.25 * (1 - Math.abs(q))) * bri), e.cauda[0] * dim, e.cauda[1] * dim, e.cauda[2] * dim));
  // Nadadeira dorsal.
  brush([[x - d * L * 0.3, y - H * 0.8], [x - d * L * 0.5, y - H * 1.3]], [H * 0.32, 0.12], [0, 1], (i) =>
    set(i, 0.5 * bri, e.cauda[0] * dim * 0.85, e.cauda[1] * dim * 0.85, e.cauda[2] * dim * 0.85));
  // Corpo.
  brush(pts, hws, lin(n), (i, a, q) => {
    const aq = Math.abs(q), c = cor(a, aq);
    let l = (0.52 + 0.36 * Math.pow(1 - aq, 0.6)) * bri;
    if (aq > 0.88) l *= 0.75;                                                   // Contorno levemente mais escuro
    set(i, clamp(l), c[0] * dim, c[1] * dim, c[2] * dim);
  });
  // Olho: um "o" escuro perto da cabeça.
  const io = celula(x - d * L * 0.12, y - H * 0.2);
  if (io >= 0) setCh(io, 0.95, 0.02, 0.03, 0.06, CH_OLHO);
}

// CENA ANIMADA
const fundo = PEIXES.filter((p) => p.plano < 0.8), frente = PEIXES.filter((p) => p.plano >= 0.8);
function scene(t) {
  const dt = Math.min(0.1, Math.max(0, t - ultimoT)); ultimoT = t;
  const m = settings.corrente;
  for (let r = 0; r < ROWS; r++) {                                         // Correnteza: ondula de leve as partes altas
    const h = clamp((BASE_Y - Yr[r]) / 150);
    rowShift[r] = 1.2 * m * (0.6 * wave(t, 2) + 0.4 * wave(t, 3, 1)) * h * h;
  }
  agua(t);
  cardumes(t);
  for (const g of ALGAS) if (g.fundo) alga(g, t);
  for (const p of fundo) peixe(p, t);
  // Areia (com a luz das cáusticas refletida nela).
  for (let c = 0; c < COLS; c++) {
    const top = topoAreia[c];
    for (let r = ROWS - 1; r >= 0 && Yr[r] > top; r--) {
      const i = r * COLS + c, y = Yr[r], x = Xc[c], n = hash3(r, c, 31) / 4294967296;
      const luzAgua = lum[i], prof = clamp((y - top) / 14);
      const ondula = 0.5 + 0.5 * Math.sin(x * 0.6 + y * 0.35);
      const l = 0.2 + 0.12 * n + 0.08 * ondula + luzAgua * 0.9 + (y - top < 1.2 ? 0.12 : 0) - 0.08 * prof;
      const col = lerp3([0.78, 0.68, 0.46], [0.22, 0.36, 0.42], 0.3 + 0.3 * prof);
      set(i, clamp(l), col[0], col[1], col[2]);
    }
  }
  for (const [x, y, rx, ry] of ROCHAS) brush([[x - rx * 0.55, y], [x + rx * 0.55, y]], [ry, ry], [0, 1], (i, a, q, r, c) => {
    const n = hash3(r, c, 41) / 4294967296;
    set(i, clamp(0.3 + 0.22 * (1 - Math.abs(q)) + 0.1 * n), 0.30 + 0.06 * n, 0.27, 0.36 + 0.05 * n);
  });
  for (const co of CORAIS) coral(co, t);
  for (const g of ALGAS) if (!g.fundo) alga(g, t);
  for (const f of FLORES_MAR) haste(f, t);
  laco(easeOut((t - 1.6) / 0.7));
  for (const f of FLORES_MAR) florMar(f, t);
  for (const p of frente) peixe(p, t);
  bolhas(t, dt);
  // Plâncton: pontinhos que cintilam na água.
  const pv = 0.45 * smoothstep(3, 4.5, t), off = Math.floor(t * 3);
  if (pv > 0) for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const i = r * COLS + c;
    if (fg[i]) continue;
    const h = hash3(c, r + off, 77) % 1000;
    if (h < 2) h ? set(i, pv, 0.62, 0.92, 0.95) : set(i, pv, 0.95, 1, 0.82);
  }
  const fade = smoothstep(0, 0.2, t);
  if (fade < 1) for (let i = 0; i < N; i++) lum[i] *= fade;
}

// CONVERSÃO DE CARACTERES ASCII EM IMAGEM
const view = document.getElementById("view"), ctx = view.getContext("2d");
const START = [], COUNT = BUCKETS.map((b) => b.length);
BUCKETS.reduce((s, b, k) => { START[k] = s; return s + b.length; }, 0);
const MASKS = [...CHARS].map((ch) => {                                     // Cria antecipadamente as máscaras de cada caractere
  const g = document.createElement("canvas"); g.width = CW; g.height = CH;
  const gx = g.getContext("2d");
  gx.font = FONT; gx.textBaseline = "top"; gx.fillStyle = "#fff"; gx.fillText(ch, 0, 0);
  const d = gx.getImageData(0, 0, CW, CH).data, m = new Uint8Array(CW * CH);
  for (let k = 0; k < m.length; k++) m[k] = d[k * 4 + 3];
  return m;
});
const ascii = document.createElement("canvas");                            // Camada ASCII com fundo transparente
const actx = ascii.getContext("2d");
const glowA = document.createElement("canvas"), glowB = document.createElement("canvas"), glowC = document.createElement("canvas");
let W, H, img, px32;

// Cria (ou recria) a grade, a água e os buffers para o tamanho atual da tela.
function setupGrid() {
  const vw = innerWidth || 1, vh = innerHeight || 1;
  GRID_ASPECT = vw / vh;
  ({ cols: COLS, rows: ROWS } = gridFor(vw, vh));
  N = COLS * ROWS;
  S = Math.max(BOX_W / (COLS * 0.5), BOX_H / ROWS);          // Unidades do mundo por linha da grade
  // O fundo do mar fica sempre rente à borda inferior; a altura que sobrar (celular em pé) vira água acima.
  Y0 = BASE_Y + 1 - ROWS * S;
  VIS = { x0: X_MID - COLS * 0.25 * S, x1: X_MID + COLS * 0.25 * S, y0: Y0, y1: Y0 + ROWS * S };
  VIS_W = VIS.x1 - VIS.x0; VIS_H = VIS.y1 - VIS.y0; VMIN = Math.min(VIS_W, VIS_H);
  HW_MIN = S > 1.15 ? 0.3 * S : 1e-3;                          // Em grades mais grossas, traços finos continuam visíveis
  Xc = new Float32Array(COLS); Yr = new Float32Array(ROWS); topoAreia = new Float32Array(COLS);
  for (let c = 0; c < COLS; c++) { Xc[c] = X_MID + (c + 0.5 - COLS / 2) * 0.5 * S; topoAreia[c] = areia(Xc[c]); }
  for (let r = 0; r < ROWS; r++) Yr[r] = Y0 + (r + 0.5) * S;
  lum = new Float32Array(N); rgb = new Float32Array(N * 3); rowShift = new Float32Array(ROWS);
  fg = new Uint8Array(N); ovr = new Int16Array(N).fill(-1);
  buildAgua();
  W = COLS * CW; H = ROWS * CH;
  view.width = W; view.height = H; ascii.width = W; ascii.height = H;
  img = actx.createImageData(W, H); px32 = new Uint32Array(img.data.buffer);
  [[glowA, 2], [glowB, 4], [glowC, 8]].forEach(([g, s]) => { g.width = Math.ceil(W / s); g.height = Math.ceil(H / s); });
  cardume.ativo = false;
}

function draw(frame) {
  px32.fill(0);
  const fidx = Math.floor(frame / 3);
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const i = r * COLS + c, L = lum[i];
    let level = 0;
    while (level < LEVELS.length && L >= LEVELS[level]) level++;
    if (level === 0) continue;
    // Bolhas e cardumes usam caractere fixo; na água, o caractere segue as ondas; no recife, varia com a luminosidade.
    const o = ovr[i];
    const ch = o >= 0 ? o : fg[i] ? START[level] + hash3(r, c, fidx) % COUNT[level] : agChar[i], m = MASKS[ch];
    const k = (0.45 + 0.75 * L) * 1.6, j = i * 3;
    const pr = Math.min(255, 255 * rgb[j] * k) | 0, pg = Math.min(255, 255 * rgb[j + 1] * k) | 0, pb = Math.min(255, 255 * rgb[j + 2] * k) | 0;
    const rgb32 = (pb << 16) | (pg << 8) | pr;
    let o0 = (r * CH) * W + c * CW, mi = 0;
    for (let y = 0; y < CH; y++, o0 += W) {
      for (let x = 0; x < CW; x++, mi++) {
        const v = m[mi];
        if (v) px32[o0 + x] = (v << 24) | rgb32;           // A opacidade segue o desenho do caractere
      }
    }
  }
  actx.putImageData(img, 0, 0);
  ctx.fillStyle = "#021320"; ctx.fillRect(0, 0, W, H);
  ctx.drawImage(ascii, 0, 0);
  if (settings.glow > 0) {                                                 // Brilho difuso, usando imagens reduzidas e ampliadas
    let src = ascii;
    for (const g of [glowA, glowB, glowC]) {
      const gx = g.getContext("2d");
      gx.imageSmoothingEnabled = true; gx.clearRect(0, 0, g.width, g.height);
      gx.drawImage(src, 0, 0, g.width, g.height); src = g;
    }
    ctx.save();
    ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = Math.min(1, settings.glow);
    ctx.imageSmoothingEnabled = true; ctx.drawImage(glowC, 0, 0, W, H);
    ctx.restore();
  }
}

// NARRATIVA: intro (0–10 s) → presente (10–20 s) → convite (a partir de 20 s) → surpresa (após o clique)
const FRASES = {
  intro: "Dizem que o mar guarda os segredos mais bonitos do mundo...",
  presente: "Então mergulhei fundo pra te trazer um pedacinho dele.",
};
const JANELAS = { intro: [0, 10], presente: [10, 20] };
const palco = document.getElementById("palco"), mensagem = document.getElementById("mensagem");
const elDigitado = mensagem.querySelector(".digitado"), elResto = mensagem.querySelector(".resto");
const botao = document.getElementById("convite"), leitor = document.getElementById("leitor"), finalEl = document.getElementById("final");
let estado = null, fraseAtual = "", digitados = -1, opMsg = -1, opBotao = -1, tSurpresa = 0;

function entrar(novo) {
  estado = novo;
  document.body.dataset.estado = novo;
  if (FRASES[novo]) {
    fraseAtual = FRASES[novo]; digitados = -1;
    leitor.textContent = fraseAtual;                     // Leitores de tela recebem a frase inteira de uma vez
  } else if (novo === "convite") {
    fraseAtual = ""; mensagem.style.opacity = "0"; opMsg = 0;
  }
}
function narrativa(t) {
  if (estado === "surpresa") return;
  const novo = t < 10 ? "intro" : t < 20 ? "presente" : "convite";
  if (novo !== estado) entrar(novo);
  if (novo === "convite") {
    const op = Math.round(smoothstep(20, REDUCED ? 20.4 : 21.2, t) * 100) / 100;
    if (op !== opBotao) { opBotao = op; botao.style.opacity = op; }
    return;
  }
  const [a, b] = JANELAS[novo];
  // A janela inteira dura 10 s: entrada gradual, digitação nos primeiros segundos, saída suave no fim.
  const op = Math.round(smoothstep(a + 0.25, a + 1.1, t) * (1 - smoothstep(b - 0.8, b - 0.05, t)) * 100) / 100;
  if (op !== opMsg) { opMsg = op; mensagem.style.opacity = op; }
  const total = fraseAtual.length;
  const n = REDUCED ? total : Math.min(total, Math.floor(total * clamp((t - a - 0.45) / 2.8)));
  if (n !== digitados) {
    digitados = n;
    elDigitado.textContent = fraseAtual.slice(0, n); elResto.textContent = fraseAtual.slice(n);
    mensagem.classList.toggle("completo", n >= total);
  }
}
function abrirSurpresa() {
  if (estado === "surpresa" || estado !== "convite") return;  // Abre uma única vez, só depois do convite
  tSurpresa = clock;
  prepararArte(); ajustarArte(); pintarArte(clock);           // O mar já está pronto antes do crossfade
  estado = "surpresa";
  document.body.dataset.estado = "surpresa";
  botao.disabled = true;
  leitor.textContent = "";
  setTimeout(() => finalEl.focus({ preventScroll: true }), REDUCED ? 400 : 1400);
}
botao.addEventListener("click", abrirSurpresa);

// CÂMERA SELFIE: abre a câmera frontal e mostra, em tela cheia e espelhada, quem está olhando o site.
// A imagem fica só no aparelho: nada é gravado nem enviado.
const btnCamera = document.getElementById("camera"), selfie = document.getElementById("selfie");
const selfieVideo = document.getElementById("selfie-video"), selfieMsg = document.getElementById("selfie-msg");
const selfieFechar = document.getElementById("selfie-fechar");
let streamCamera = null, abrindoCamera = false;
function mostrarSelfie() {
  selfie.hidden = false;
  requestAnimationFrame(() => selfie.classList.add("visivel"));
  selfieFechar.focus({ preventScroll: true });
}
async function abrirCamera() {
  if (abrindoCamera || streamCamera) return;
  abrindoCamera = true;
  selfieMsg.textContent = "";
  mostrarSelfie();                       // A tela já aparece enquanto o navegador pede a permissão
  carregarSegmentador();                 // O modelo de contorno carrega em paralelo com a permissão da câmera
  try {
    if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {

    }

      video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false,
    });
    if (selfie.hidden) { streamCamera.getTracks().forEach((tr) => tr.stop()); streamCamera = null; return; }   // Fechou antes de liberar
    selfieVideo.srcObject = streamCamera;
    await selfieVideo.play().catch(() => {});
    iniciarEfeitos();
  } catch (e) {
    streamCamera = null;
    selfieMsg.textContent =
      e.name === "NotAllowedError" || e.name === "SecurityError"

        : e.name === "NotFoundError" || e.name === "OverconstrainedError"
        ? "Não encontrei uma câmera frontal neste aparelho."
        : e.name === "Inseguro"

        : "Não foi possível abrir a câmera agora. Tente novamente.";
  } finally {

}
function fecharCamera() {
  pararEfeitos();
  if (streamCamera) streamCamera.getTracks().forEach((tr) => tr.stop());   // Desliga a câmera de verdade
  streamCamera = null; selfieVideo.srcObject = null;
  selfie.classList.remove("visivel");
  setTimeout(() => { selfie.hidden = true; }, REDUCED ? 0 : 800);
  btnCamera.focus({ preventScroll: true });
}
btnCamera.addEventListener("click", abrirCamera);

selfie.addEventListener("keydown", (e) => { if (e.key === "Escape") fecharCamera(); });

// EFEITO "TESOURO DO MAR" NA SELFIE
// Um modelo de segmentação (MediaPipe, do Google) separa a pessoa do fundo a cada quadro. Com essa máscara:
//  • atrás da pessoa aparece o mar (oceano.png), escurecido em 50%;
//  • a pessoa recebe um halo azul-água pulsante e um contorno fino quase branco, como luz na água;
//  • bolhas ASCII (. o O) nascem do contorno e sobem; peixinhos-palhaço (peixe.gif) nadam em volta da cabeça.
// Tudo é processado no próprio aparelho. Se o modelo não carregar (sem internet), fica uma moldura azul-água.
const selfieCanvas = document.getElementById("selfie-canvas"), gSelfie = selfieCanvas.getContext("2d");

const [mascC, gMasc] = novoCanvas(), [b0C, gB0] = novoCanvas(), [b1C, gB1] = novoCanvas(), [b2C, gB2] = novoCanvas(), [tmpC, gTmp] = novoCanvas();

const marFundo = new Image();                                          // Fundo da selfie: o mar
marFundo.src = "oceano.png";
const cardumeSelfie = document.getElementById("cardume-selfie");
const peixesSelfie = Array.from({ length: 5 }, () => {
  const img = new Image(); img.src = "peixe.gif"; img.alt = ""; img.decoding = "async";
  cardumeSelfie.appendChild(img); return img;
});
let acumBolhasSelfie = 0;
const MP_URL = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
const MODELO = "https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite";
let segmentador = null, segEstado = "parado", rafSelfie = 0, ultimoTempoVideo = -1;

const SEL_DPR = () => Math.min(1.5, devicePixelRatio || 1);

const BOLHA_COR = ["210,245,255", "140,225,255", "255,255,255", "120,200,255"];
const bolhasSelfie = Array.from({ length: 110 }, () => ({ vivo: false }));

async function carregarSegmentador() {
  if (segEstado !== "parado") return;
  segEstado = "carregando";
  try {
    const { FilesetResolver, ImageSegmenter } = await import(`${MP_URL}/vision_bundle.mjs`);
    const vision = await FilesetResolver.forVisionTasks(`${MP_URL}/wasm`);
    const opcoes = (delegate) => ({ baseOptions: { modelAssetPath: MODELO, delegate }, runningMode: "VIDEO",
      outputConfidenceMasks: true, outputCategoryMask: false });
    try { segmentador = await ImageSegmenter.createFromOptions(vision, opcoes("GPU")); }
    catch { segmentador = await ImageSegmenter.createFromOptions(vision, opcoes("CPU")); }
    segEstado = "pronto";
  } catch (e) {
    segmentador = null; segEstado = "falhou";                         // Segue só com a moldura azul-água
  }
}

function prepararMascara(w, h) {
  mascW = w; mascH = h; mascC.width = w; mascC.height = h; tmpC.width = w; tmpC.height = h;
  b0C.width = Math.ceil(w / 2); b0C.height = Math.ceil(h / 2);         // Desfoques por redução: fino, médio e amplo
  b1C.width = Math.ceil(w / 5); b1C.height = Math.ceil(h / 5);

// Recebe a máscara de confiança (0 = fundo, 1 = pessoa) e a copia para o canvas da máscara.
function receberMascara(res) {
  const m = res && res.confidenceMasks && res.confidenceMasks[0];
  if (!m) return;
  if (m.width !== mascW || m.height !== mascH) prepararMascara(m.width, m.height);
  const d = m.getAsFloat32Array(), w = mascW, h = mascH, px = mascImg.data;
  if (inverter === null) {                                            // Confere se a máscara veio "pessoa = 1"
    let centro = 0, nc = 0, borda = 0, nb = 0;
    for (let y = 0; y < h; y += 4) for (let x = 0; x < w; x += 4) {
      const v = d[y * w + x];
      if (x > w * 0.35 && x < w * 0.65 && y > h * 0.3) { centro += v; nc++; }
      else if (x < w * 0.1 || x > w * 0.9) { borda += v; nb++; }
    }

    px[j + 3] = v < 0.25 ? 0 : v > 0.75 ? 255 : ((v - 0.25) / 0.5) * 255;     // Borda suave
  }

  nBordas = 0;

  for (let y = 1; y < h - 1; y += 2) {
    let nLinha = 0, sx = 0;
    for (let x = 1; x < w - 1; x++) {
      const k = y * w + x, dentro = mascVal[k] > 0.5;
      if (dentro) { nLinha++; sx += x; }
      if (dentro && nBordas < bordas.length &&
          (mascVal[k - 1] <= 0.5 || mascVal[k + 1] <= 0.5 || mascVal[k - w] <= 0.5 || mascVal[k + w] <= 0.5)) bordas[nBordas++] = k;

  }
  if (topo >= 0 && nX) {
    let largura = 0;
    const yl = Math.min(h - 1, topo + Math.round(h * 0.1));
    for (let x = 0; x < w; x++) if (mascVal[yl * w + x] > 0.5) largura++;

    cabeca.x += (somaX / nX / w - cabeca.x) * suave;
    cabeca.y += (topo / h - cabeca.y) * suave;
    cabeca.w += (clamp(largura / w, 0.08, 0.6) - cabeca.w) * suave;

}

function iniciarEfeitos() {
  cancelAnimationFrame(rafSelfie);
  ultimoTempoVideo = -1; mascPronta = false; inverter = null; amostrasInv = 0; cabeca.ok = false;
  bolhasSelfie.forEach((p) => { p.vivo = false; });
  rafSelfie = requestAnimationFrame(quadroSelfie);
}
function pararEfeitos() {
  cancelAnimationFrame(rafSelfie); rafSelfie = 0;
  cardumeSelfie.hidden = true;
  gSelfie.setTransform(1, 0, 0, 1, 0, 0); gSelfie.clearRect(0, 0, selfieCanvas.width, selfieCanvas.height);
}
let ultimoQuadroSelfie = 0;
function quadroSelfie(now) {
  rafSelfie = requestAnimationFrame(quadroSelfie);

  if (v.readyState < 2 || !v.videoWidth) return;
  const dpr = SEL_DPR(), W = Math.round(innerWidth * dpr), H = Math.round(innerHeight * dpr);
  if (selfieCanvas.width !== W || selfieCanvas.height !== H) { selfieCanvas.width = W; selfieCanvas.height = H; }
  if (segmentador && v.currentTime !== ultimoTempoVideo) {
    ultimoTempoVideo = v.currentTime;
    // O modelo recebe uma cópia reduzida (320 px de largura): a máscara fica leve e rápida até em celulares.
    const ew = 320, eh = Math.round(320 * v.videoHeight / v.videoWidth);
    if (entradaC.width !== ew || entradaC.height !== eh) { entradaC.width = ew; entradaC.height = eh; }
    gEntrada.drawImage(v, 0, 0, ew, eh);
    try { segmentador.segmentForVideo(entradaC, now, receberMascara); } catch (e) { /* quadro ignorado */ }
  }
  const dt = Math.min(0.1, (now - (ultimoQuadroSelfie || now)) / 1000);
  ultimoQuadroSelfie = now;
  desenharSelfie(now / 1000, dt, W, H, dpr);
}

function desenharSelfie(t, dt, W, H, dpr) {
  const g = gSelfie, v = selfieVideo, vw = v.videoWidth, vh = v.videoHeight;
  const s = Math.max(W / vw, H / vh), dw = vw * s, dh = vh * s, dx = (W - dw) / 2, dy = (H - dh) / 2;
  const pulso = REDUCED ? 0.85 : 0.72 + 0.28 * Math.sin(t * 2.1);

    g.setTransform(1, 0, 0, 1, 0, 0);

      const qw = marFundo.naturalWidth, qh = marFundo.naturalHeight, qs = Math.max(W / qw, H / qh);

    gPessoa.globalCompositeOperation = "source-over"; gPessoa.setTransform(1, 0, 0, 1, 0, 0);
    g.drawImage(pessoaC, 0, 0);
    g.setTransform(-1, 0, 0, 1, W, 0);                                 // Espelho, para o halo e o contorno
    // Desfoques da silhueta.
    for (const [c, gc] of [[b0C, gB0], [b1C, gB1], [b2C, gB2]]) {

    gTmp.globalCompositeOperation = "source-in"; gTmp.fillStyle = "rgb(60,205,255)"; gTmp.fillRect(0, 0, mascW, mascH);
    gTmp.globalCompositeOperation = "destination-out"; gTmp.drawImage(mascC, 0, 0);

    gTmp.drawImage(b0C, 0, 0, mascW, mascH); gTmp.drawImage(b0C, 0, 0, mascW, mascH);
    gTmp.globalCompositeOperation = "source-in"; gTmp.fillStyle = "rgb(205,250,255)"; gTmp.fillRect(0, 0, mascW, mascH);

  for (let n = 0; n < novas; n++) {
    const p = bolhasSelfie.find((q) => !q.vivo);
    if (!p) break;
    if (mascPronta && nBordas) {
      const k = bordas[(Math.random() * nBordas) | 0];
      p.x = telaX(((k % mascW) + 0.5) / mascW); p.y = telaY((Math.floor(k / mascW) + 0.5) / mascH);
    } else { p.x = Math.random() * W; p.y = H * (0.85 + Math.random() * 0.15); }
    p.x0 = p.x; p.vy = -(30 + Math.random() * 50) * dpr * (REDUCED ? 0.2 : 1);

  g.shadowBlur = 0; g.globalAlpha = 1;
  // Peixinhos-palhaço (peixe.gif) nadando em volta da cabeça. São <img> sobre o canvas,
  // porque um GIF desenhado no canvas ficaria parado no primeiro quadro.
  if (mascPronta && cabeca.ok) {
    const css = 1 / dpr;
    const rx = cabeca.w * dw * 0.68 * css, ry = rx * 0.26, cx = telaX(cabeca.x) * css;
    const base = clamp(cabeca.w * dw * css * 0.34, 40, 120);           // Largura do peixe, proporcional à cabeça
    const cy = Math.max(base * 0.5 + ry, telaY(cabeca.y) * css - rx * 0.1);
    const giro = REDUCED ? 0 : t * 0.55;
    cardumeSelfie.hidden = false;
    peixesSelfie.forEach((img, k) => {
      const a = giro + (k / peixesSelfie.length) * TAU, z = Math.sin(a);  // z < 0: peixe "atrás" da cabeça
      const larg = base * (z < 0 ? 0.68 : 1), alt = larg * 480 / 586;
      // O GIF olha para a esquerda: na frente o peixe nada para a esquerda; atrás, vira e nada para a direita.
      const vira = z < 0 ? -1 : 1, sobe = Math.sin(t * 2.4 + k) * alt * 0.08;
      img.style.width = `${larg.toFixed(1)}px`; img.style.height = `${alt.toFixed(1)}px`;
      img.style.transform = `translate(${(cx + Math.cos(a) * rx - larg / 2).toFixed(1)}px, ${(cy + z * ry - alt / 2 + sobe).toFixed(1)}px) scaleX(${vira})`;
      img.style.opacity = z < 0 ? "0.55" : "1";
      img.style.zIndex = z < 0 ? "1" : "2";
    });
  } else cardumeSelfie.hidden = true;
}

// MÚSICA DE FUNDO: oceano.mp3 em loop infinito, iniciada automaticamente ao abrir.
// Se o navegador bloquear o áudio automático (Chrome, Safari e Firefox exigem um toque antes do som),
// a música começa no primeiro toque, clique ou tecla em qualquer lugar da página.
const musica = document.getElementById("musica"), btnSom = document.getElementById("som");
let somDesejado = true;
musica.volume = 0.75;
function atualizarSom() {
  const tocando = !musica.paused;
  btnSom.textContent = tocando ? "[ som: ligado ]" : somDesejado ? "[ ativar som ]" : "[ som: desligado ]";
  btnSom.setAttribute("aria-pressed", String(tocando));
  btnSom.classList.toggle("bloqueado", !tocando && somDesejado);
}
function tocarMusica() {
  const p = musica.play();
  if (p && p.catch) p.catch(atualizarSom);
}
const GESTOS = ["pointerdown", "keydown", "touchend"];
function destravar(e) {
  if (e.target && e.target.closest && e.target.closest("#som")) return;   // O botão de som decide sozinho
  if (somDesejado && musica.paused) tocarMusica();
}
GESTOS.forEach((ev) => addEventListener(ev, destravar, { capture: true, passive: true }));
musica.addEventListener("play", atualizarSom);
musica.addEventListener("pause", atualizarSom);
musica.addEventListener("playing", () => GESTOS.forEach((ev) => removeEventListener(ev, destravar, { capture: true })), { once: true });
btnSom.addEventListener("click", () => {
  if (musica.paused) { somDesejado = true; tocarMusica(); }
  else { somDesejado = false; musica.pause(); }
  atualizarSom();
});
atualizarSom();
tocarMusica();

// Posiciona o palco de textos na água aberta, acima do recife, acompanhando o "contain" do canvas.
function posicionarPalco() {
  const vw = innerWidth || 1, vh = innerHeight || 1, sc = Math.min(vw / W, vh / H);
  const ox = (vw - W * sc) / 2, oy = (vh - H * sc) / 2;
  const x = ox + (COLS / 2) * CW * sc;
  const y = oy + ((52 - Y0) / S) * CH * sc;                   // Altura da água aberta, acima do buquê
  const bw = 124 * 2 / S * CW * sc;
  palco.style.setProperty("--ax", `${x}px`);
  palco.style.setProperty("--ay", `${clamp(y, vh * 0.22, vh * 0.7)}px`);
  palco.style.setProperty("--bw", `${bw}px`);
}

// EXECUÇÃO DA ANIMAÇÃO
// O relógio só avança com a aba visível, para a narrativa não "pular" etapas em segundo plano.
setupGrid();
posicionarPalco();
let clock = 0, lastNow = performance.now(), lastDraw = -1e9, lastArte = -1e9, rafId = 0;
function tick(now) {
  rafId = requestAnimationFrame(tick);
  clock += Math.min(0.1, Math.max(0, (now - lastNow) / 1000));
  lastNow = now;
  narrativa(clock);
  const tS = clock - tSurpresa, emSurpresa = estado === "surpresa";
  if ((!emSurpresa || tS < 2.2) && now - lastDraw >= 1000 / FPS - 2) {   // O recife para de ser desenhado após o crossfade
    lastDraw = now;
    scene(clock);
    draw(Math.floor(clock * FPS));
  }
  if (emSurpresa && arteLayout && (REDUCED ? arteUltima < 0 : now - lastArte >= 1000 / 24)) {
    lastArte = now; arteUltima = clock;
    pintarArte(clock);
  }
}
rafId = requestAnimationFrame(tick);
document.addEventListener("visibilitychange", () => {
  cancelAnimationFrame(rafId);
  if (!document.hidden) { lastNow = performance.now(); rafId = requestAnimationFrame(tick); }
});

// Redimensionamento: textos e mar se ajustam sempre; a grade do recife só é recriada
// quando a proporção muda bastante (ex.: girar o celular). Nada reinicia a narrativa.
let resizeTimer = 0;
const onResize = () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const a = (innerWidth || 1) / (innerHeight || 1);
    if (estado !== "surpresa" && Math.abs(Math.log(a / GRID_ASPECT)) > 0.15) { setupGrid(); lastDraw = -1e9; }
    posicionarPalco();
    if (arteLayout) ajustarArte();
  }, 200);
};
addEventListener("resize", onResize);
addEventListener("orientationchange", onResize);
</script>
</body>
</html>
